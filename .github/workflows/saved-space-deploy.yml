name: Saved Space deploy

# Runs when something under saved-space/ is merged to main. Needs one GitHub secret and two GitHub variables (see saved-space/docs/SETUP.md).
on:
  push:
    branches: [main]
    paths: ['saved-space/**', '.github/workflows/saved-space-deploy.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: Build the API (a ready-made .NET 10 function app)
        run: dotnet publish saved-space/api/SavedSpace.Functions --configuration Release --output saved-space/api/publish

      - name: Build the app (only public values go in: project address and publishable key)
        working-directory: saved-space/web
        env:
          SS_SUPABASE_URL: ${{ vars.SS_SUPABASE_URL }}
          SS_SUPABASE_KEY: ${{ vars.SS_SUPABASE_KEY }}
        run: |
          npm ci
          npm run build
          npm run check:bundle

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: saved-space/web/dist/web/browser
          api_location: saved-space/api/publish
          skip_app_build: true
          skip_api_build: true
